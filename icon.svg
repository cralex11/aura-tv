<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#030303"/>
    </radialGradient>
    <linearGradient id="prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Chassis -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Ambient Center Core -->
  <circle cx="256" cy="224" r="100" fill="url(#prism)" filter="url(#subtle-glow)" opacity="0.8"/>
  
  <!-- Minimalist Geometric Screen & Play Icon -->
  <rect x="146" y="134" width="220" height="144" rx="22" fill="rgba(10, 10, 15, 0.7)" stroke="#ffffff" stroke-width="7"/>
  <polygon points="238,180 238,232 284,206" fill="#ffffff"/>
  
  <!-- Modern Clean Typography -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">AURA TV</text>
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#71717a" text-anchor="middle" letter-spacing="6">HOME LAUNCHER</text>
</svg>
